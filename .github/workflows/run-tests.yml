name: Pipeline QA Avanzado Hibrido

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Permisos requeridos para escribir el reporte en GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  automation-tests:
    runs-on: ubuntu-latest

    steps:
    # 1. Copiar el código fuente
    - name: Copiar codigo del repositorio
      uses: actions/checkout@v4

    # 2. Configurar Java con Caché Avanzada para dependencias (.m2)
    - name: Configurar Java JDK 17 con Cache
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven' # CACHÉ AVANZADA: Omitirá descargar Selenium/RestAssured en cada ejecución si no han cambiado

    # 3. Instalar Google Chrome para pruebas UI
    - name: Instalar Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    # 4. EJECUCIÓN EN PARALELO (Aceleración de pruebas)
    # Ejecuta el archivo XML distribuyendo las clases/métodos al mismo tiempo
    - name: Ejecutar Suite TestNG en Paralelo
      run: mvn test -DsuiteXmlFile=testng.xml -Dparallel=tests -DthreadCount=3
      continue-on-error: true # Permite que el pipeline no se detenga si un test falla, para poder generar el reporte final

    # 5. Obtener el historial de reportes previos (Obligatorio para ver gráficos de tendencia en Allure)
    - name: Cargar historial de Allure
      uses: actions/checkout@v4
      if: always()
      with:
        ref: gh-pages
        path: gh-pages-dir
        continue-on-error: true

	# 6. Compilar y Generar el Reporte de Allure
	- name: Generar Reporte de Allure
	  uses: simple-elf/allure-report-action@master
	  if: always()
	  with:
	    allure_results: allure-results
	    allure_history: allure-history
	    keep_reports: 20

	# 6.5 Subir los archivos generados como artefacto de Pages (Requerido por la acción oficial)
	- name: Configurar artefacto de Pages
	  uses: actions/upload-pages-artifact@v3
	  if: always()
	  with:
	    path: allure-history

	# 7. Publicar el Reporte Interactivo Gratis en GitHub Pages
	- name: Desplegar Reporte en GitHub Pages
	  uses: actions/deploy-pages@v4
	  if: always()
