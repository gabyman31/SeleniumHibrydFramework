name: Pipeline QA Avanzado Hibrido

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  automation-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar codigo del repositorio
      uses: actions/checkout@v4

     Tarjeta 2: Configurar Java
    - name: Configurar Java JDK 17 con Cache
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

     Tarjeta 3: Instalar Navegador
    - name: Instalar Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

     Tarjeta 4: Ejecución en Paralelo
    - name: Ejecutar Suite TestNG en Paralelo
      run: mvn test -DsuiteXmlFile=testng.xml -Dparallel=tests -DthreadCount=3
      continue-on-error: true

     Tarjeta 5: Historial previo de Allure
    - name: Cargar historial de Allure
      uses: actions/checkout@v4
      if: always()
      with:
        ref: gh-pages
        path: gh-pages-dir
        continue-on-error: true

     Tarjeta 6: Generar Reporte Allure con su Historia
    - name: Generar Reporte de Allure
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        allure_history: allure-history
        gh_pages: gh-pages-dir
        keep_reports: 20

     Tarjeta 7: Publicar en GitHub Pages de Forma Limpia
    - name: Desplegar Reporte en GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history

